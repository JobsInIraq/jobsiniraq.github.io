<!-- Unified Language Switcher -->
<div class="language-switcher-wrapper">
  <label for="globalLangPicker" class="visually-hidden">Select Language</label>
  <select id="globalLangPicker" class="language-picker" aria-label="Select Language" data-testid="select-language">
    <option value="en">EN</option>
    <option value="ar">عربي</option>
    <option value="ku">کوردی</option>
  </select>
</div>
